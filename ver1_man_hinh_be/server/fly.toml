app = 'xiaozhi-esp32-server'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

# Khoá API đặt bằng secret, KHÔNG ghi ở đây:
#   fly secrets set GROQ_API_KEY=... XAI_API_KEY=...
[env]
  TTS_PROVIDER = 'xai'
  XAI_TTS_VOICE = 'eve'
  LLM_MODEL = 'qwen/qwen3.8-27b'
  TTS_GAIN_DB = '12'
  TTS_HPF_HZ = '300'
  # Tinh chỉnh VAD cho mic thật. Ba số này từng chỉ nằm trong `fly secrets`
  # nên không có trong git — mất máy là mất tinh chỉnh. Chúng không phải khoá
  # bí mật, chỗ của chúng là ở đây.
  #
  # 3000 -> 1000 ngày 07/10/2026. Số 3000 đặt hôm trước là để bù tiếng ù trầm,
  # mà audio.HighPass giờ đã lọc sạch tiếng ù đó. Sàn nhiễu đo trên mic thật
  # sau khi lọc chỉ còn 98 / 504 / 523 / 762 qua bốn lượt, nên 3000 ghim ngưỡng
  # ở mức gấp 4-30 lần sàn và chặn luôn ngưỡng thích nghi (sàn x 2,0 ~ 1000).
  # Hậu quả trong log 13:41-13:42: lượt im lặng chỉ có 10/721 khung tính là
  # tiếng nói, chạy 15-28 giây mới chốt.
  VAD_ENERGY = '1000'
  VAD_NOISE_RATIO = '2.0'
  VAD_SILENCE_MS = '550'
  # Dáng đi — ba nút như servo_dash.py, xem GAIT trong xiaozhi_server.py
  OTTO_PERIOD = '1000'
  OTTO_AMP = '100'
  OTTO_LIFT = '5'
  # Firmware nhận địa chỉ WebSocket từ OTA; ghi thẳng cho chắc thay vì suy từ header proxy.
  PUBLIC_BASE_URL = 'https://xiaozhi-esp32-server.fly.dev'

# Một cổng cho cả OTA (https) lẫn WebSocket (wss), cùng đi qua 443:
#   https://xiaozhi-esp32-server.fly.dev/xiaozhi/ota/
#   wss://xiaozhi-esp32-server.fly.dev/xiaozhi/v1/
[http_service]
  internal_port = 8000
  force_https = true
  # Robot luôn nghe giữ kết nối suốt — để máy tự tắt thì lần nối lại mất ~10 giây khởi động.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = 'GET'
    path = '/xiaozhi/ota/'
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
